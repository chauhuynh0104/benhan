<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Zalo Sprite to GIF Converter</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 30px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0068ff; margin-top: 0; text-align: center; }
        label { font-weight: bold; font-size: 13px; color: #444; }
        input { width: 100%; padding: 10px; margin: 6px 0 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        button { width: 100%; padding: 12px; background: #0068ff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #0052cc; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #555; }
        #result { margin-top: 15px; text-align: center; }
        #result img { border: 2px dashed #0068ff; border-radius: 6px; padding: 5px; background: #fff; max-width: 100%; }
        .btn-download { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn-download:hover { background: #218838; }
        #gifPreview { margin-top: 15px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #0068ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2>Zalo Sprite sang GIF</h2>
    
    <label>URL Sprite Zalo:</label>
    <input type="text" id="spriteUrl" value="https://zalo-api.zadn.vn/api/emoticon/sprite?eid=43523&size=130&checksum=85803b1a4d049e495049ec2a338b6605">

    <div class="row">
        <div>
            <label>Rộng (px):</label>
            <input type="number" id="w" value="130">
        </div>
        <div>
            <label>Cao (px):</label>
            <input type="number" id="h" value="130">
        </div>
        <div>
            <label>Độ trễ (ms):</label>
            <input type="number" id="delay" value="80">
        </div>
    </div>

    <button onclick="convert()">Tạo File GIF Đầy Đủ</button>

    <div id="status"></div>
    <div id="result">
        <div id="gifPreview"></div>
    </div>
</div>

<script>
// GIF Encoder đơn giản không cần Worker
class SimpleGIFEncoder {
    constructor(width, height, delay) {
        this.width = width;
        this.height = height;
        this.delay = delay;
        this.frames = [];
        this.canvas = document.createElement('canvas');
        this.canvas.width = width;
        this.canvas.height = height;
        this.ctx = this.canvas.getContext('2d');
    }

    addFrame(ctx) {
        // Lưu frame dưới dạng ImageData
        const imageData = ctx.getImageData(0, 0, this.width, this.height);
        this.frames.push(imageData);
    }

    async render() {
        if (this.frames.length === 0) return null;

        // Tạo canvas để vẽ từng frame
        const canvas = document.createElement('canvas');
        canvas.width = this.width;
        canvas.height = this.height;
        const ctx = canvas.getContext('2d');

        // Chuyển đổi frames thành base64 images
        const frameImages = [];
        for (const frame of this.frames) {
            ctx.putImageData(frame, 0, 0);
            frameImages.push(canvas.toDataURL('image/png'));
        }

        // Tạo GIF bằng cách sử dụng MediaRecorder với canvas
        const gifCanvas = document.createElement('canvas');
        gifCanvas.width = this.width;
        gifCanvas.height = this.height;
        const gifCtx = gifCanvas.getContext('2d');

        const stream = gifCanvas.captureStream(1000 / this.delay);
        const recorder = new MediaRecorder(stream, {
            mimeType: 'video/webm',
            videoBitsPerSecond: 5000000
        });

        const chunks = [];
        recorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
                chunks.push(e.data);
            }
        };

        return new Promise((resolve, reject) => {
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                resolve(blob);
            };

            recorder.start(100);
            
            let frameIndex = 0;
            const interval = setInterval(() => {
                const img = new Image();
                img.onload = () => {
                    gifCtx.clearRect(0, 0, this.width, this.height);
                    gifCtx.drawImage(img, 0, 0);
                };
                img.src = frameImages[frameIndex];
                
                frameIndex = (frameIndex + 1) % frameImages.length;
            }, this.delay);

            // Dừng sau khi đã render đủ số lần
            setTimeout(() => {
                clearInterval(interval);
                recorder.stop();
            }, this.delay * this.frames.length + 100);
        });
    }
}

// Hàm chuyển đổi
async function convert() {
    const status = document.getElementById('status');
    const gifPreview = document.getElementById('gifPreview');
    
    let rawUrl = document.getElementById('spriteUrl').value;
    let cleanUrl = rawUrl.replace(/&quot;/g, '').replace(/"/g, '').trim();
    
    const w = parseInt(document.getElementById('w').value) || 130;
    const h = parseInt(document.getElementById('h').value) || 130;
    const delay = parseInt(document.getElementById('delay').value) || 80;

    status.innerHTML = "Đang tải ảnh Sprite...";
    gifPreview.innerHTML = '';

    try {
        // Tải ảnh sprite
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = cleanUrl;
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

        const totalFrames = Math.floor(img.width / w);
        if (totalFrames === 0) {
            throw new Error('Không tìm thấy khung hình nào!');
        }
        
        status.innerHTML = `Đang cắt ${totalFrames} khung hình...`;

        // Cắt các khung hình
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const encoder = new SimpleGIFEncoder(w, h, delay);

        for (let i = 0; i < totalFrames; i++) {
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, i * w, 0, w, h, 0, 0, w, h);
            encoder.addFrame(ctx);
            
            if (i % 5 === 0 || i === totalFrames - 1) {
                status.innerHTML = `Đang xử lý khung ${i + 1}/${totalFrames}...`;
                await new Promise(r => setTimeout(r, 10));
            }
        }

        status.innerHTML = 'Đang tạo GIF... <span class="loading"></span>';

        // Render GIF
        const gifBlob = await encoder.render();
        
        if (!gifBlob) {
            throw new Error('Không thể tạo GIF!');
        }

        // Tạo URL
        const url = URL.createObjectURL(gifBlob);
        
        // Hiển thị preview
        const previewImg = document.createElement('img');
        previewImg.src = url;
        previewImg.style.maxWidth = '100%';
        previewImg.style.border = '2px dashed #0068ff';
        previewImg.style.borderRadius = '6px';
        previewImg.style.padding = '5px';
        previewImg.alt = 'GIF Preview';
        
        // Nút tải về
        const downloadBtn = document.createElement('a');
        downloadBtn.className = 'btn-download';
        downloadBtn.download = 'zalo_sticker.gif';
        downloadBtn.href = url;
        downloadBtn.textContent = '📥 Tải xuống GIF';
        
        gifPreview.innerHTML = '';
        gifPreview.appendChild(previewImg);
        gifPreview.appendChild(document.createElement('br'));
        gifPreview.appendChild(downloadBtn);
        
        status.innerHTML = '✅ Tạo GIF thành công! (Click nút bên dưới để tải về)';

    } catch (err) {
        status.innerHTML = '❌ Lỗi: ' + err.message;
        console.error(err);
    }
}
</script>

</body>
</html>
