<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo Sprite to GIF Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #0068ff; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #333; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        button {
            width: 100%;
            padding: 12px;
            background: #0068ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #0052cc; }
        #status { margin-top: 15px; text-align: center; font-weight: 500; color: #555; }
        #result { margin-top: 15px; text-align: center; }
        #result img { border: 2px dashed #0068ff; border-radius: 8px; padding: 4px; background: #fff; }
        .btn-download {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-download:hover { background: #218838; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/2.6.0/gifshot.min.js"></script>
</head>
<body>

<div class="card">
    <h2>Chuyển Sprite Zalo Sang GIF</h2>
    
    <div class="form-group">
        <label>URL Sprite Zalo:</label>
        <input type="text" id="spriteUrl" value="https://zalo-api.zadn.vn/api/emoticon/sprite?eid=43523&size=130&checksum=85803b1a4d049e495049ec2a338b6605">
    </div>

    <div class="row">
        <div class="form-group">
            <label>Rộng (px):</label>
            <input type="number" id="frameWidth" value="130">
        </div>
        <div class="form-group">
            <label>Cao (px):</label>
            <input type="number" id="frameHeight" value="130">
        </div>
        <div class="form-group">
            <label>Độ trễ (ms):</label>
            <input type="number" id="delay" value="80">
        </div>
    </div>

    <button onclick="makeGif()">Tải File GIF Động</button>

    <div id="status"></div>
    <div id="result"></div>
</div>

<script>
async function makeGif() {
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    
    let rawUrl = document.getElementById('spriteUrl').value;
    let cleanUrl = rawUrl.replace(/&quot;/g, '').replace(/"/g, '').trim();
    
    const w = parseInt(document.getElementById('frameWidth').value) || 130;
    const h = parseInt(document.getElementById('frameHeight').value) || 130;
    const delayMs = parseInt(document.getElementById('delay').value) || 80;

    status.innerText = "Đang tải ảnh Sprite từ Zalo...";
    result.innerHTML = "";

    try {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = cleanUrl;
        
        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject('Không thể tải ảnh. Hãy kiểm tra URL!');
        });

        const totalFrames = Math.floor(img.width / w);
        if (totalFrames <= 0) {
            status.innerText = "Kích thước chiều rộng ảnh không hợp lệ.";
            return;
        }

        status.innerText = `Đang cắt ${totalFrames} khung hình...`;

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const frames = [];
        for (let i = 0; i < totalFrames; i++) {
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, i * w, 0, w, h, 0, 0, w, h);
            frames.push(canvas.toDataURL('image/png'));
        }

        status.innerText = "Đang đóng gói thành file .GIF...";

        gifshot.createGIF({
            images: frames,
            gifWidth: w,
            gifHeight: h,
            interval: delayMs / 1000,
            numWorkers: 2
        }, function (obj) {
            if (!obj.error) {
                status.innerText = "Tạo file GIF thành công!";
                result.innerHTML = `
                    <p><b>Xem trước GIF động:</b></p>
                    <img src="${obj.image}" alt="GIF Animated"><br>
                    <a class="btn-download" href="${obj.image}" download="zalo_sticker.gif">Tải File .GIF Về Máy</a>
                `;
            } else {
                status.innerText = "Lỗi khi đóng gói GIF: " + obj.error;
            }
        });

    } catch (err) {
        status.innerText = "Lỗi: " + err;
    }
}
</script>

</body>
</html>
