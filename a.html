
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Zalo Sprite to GIF Converter</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 30px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0068ff; margin-top: 0; text-align: center; }
        label { font-weight: bold; font-size: 13px; color: #444; }
        input { width: 100%; padding: 10px; margin: 6px 0 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        button { width: 100%; padding: 12px; background: #0068ff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #0052cc; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #555; }
        #result { margin-top: 15px; text-align: center; }
        #result img { border: 2px dashed #0068ff; border-radius: 6px; padding: 5px; background: #fff; }
        .btn-download { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
</head>
<body>

<div class="card">
    <h2>Zalo Sprite sang GIF</h2>
    
    <label>URL Sprite Zalo:</label>
    <input type="text" id="spriteUrl" value="https://zalo-api.zadn.vn/api/emoticon/sprite?eid=43523&size=130&checksum=85803b1a4d049e495049ec2a338b6605">

    <div class="row">
        <div>
            <label>Rộng (px):</label>
            <input type="number" id="w" value="130">
        </div>
        <div>
            <label>Cao (px):</label>
            <input type="number" id="h" value="130">
        </div>
        <div>
            <label>Độ trễ (ms):</label>
            <input type="number" id="delay" value="80">
        </div>
    </div>

    <button onclick="convert()">Tạo File GIF Đầy Đủ</button>

    <div id="status"></div>
    <div id="result"></div>
</div>

<script>
async function convert() {
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    
    let rawUrl = document.getElementById('spriteUrl').value;
    let cleanUrl = rawUrl.replace(/&quot;/g, '').replace(/"/g, '').trim();
    
    const w = parseInt(document.getElementById('w').value) || 130;
    const h = parseInt(document.getElementById('h').value) || 130;
    const delayMs = parseInt(document.getElementById('delay').value) || 80;
    const delayCentiSec = Math.max(1, Math.round(delayMs / 10)); // GIF chuẩn dùng đơn vị 1/100 giây

    status.innerText = "Đang tải ảnh Sprite...";
    result.innerHTML = "";

    try {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = cleanUrl;
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

        const totalFrames = Math.floor(img.width / w);
        status.innerText = `Đang xử lý ${totalFrames} khung hình...`;

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Khởi tạo GIF buffer bằng omggif
        const buffer = new Uint8Array(w * h * totalFrames * 5 + 1024);
        const gf = new omggif.GifWriter(buffer, w, h, { loop: 0 });

        for (let i = 0; i < totalFrames; i++) {
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, i * w, 0, w, h, 0, 0, w, h);
            
            const imgData = ctx.getImageData(0, 0, w, h);
            const pixels = imgData.data;

            // Xử lý bảng màu Palette đơn giản cho GIF 256 màu (RGB332 + Alpha threshold)
            const palette = [];
            const indexedPixels = new Uint8Array(w * h);
            const colorMap = new Map();

            for (let j = 0; j < pixels.length; j += 4) {
                const r = pixels[j];
                const g = pixels[j + 1];
                const b = pixels[j + 2];
                const a = pixels[j + 3];

                // Khử transparent thấp
                if (a < 128) {
                    indexedPixels[j / 4] = 0; // Màu trong suốt (vị trí 0 trong palette)
                    continue;
                }

                // Quantize RGB đơn giản để gom màu
                const rgbKey = ((r & 0xE0) << 1) | ((g & 0xE0) >> 2) | ((b & 0xC0) >> 6);
                let colorIdx = colorMap.get(rgbKey);

                if (colorIdx === undefined) {
                    if (palette.length < 256) {
                        const hex = (r << 16) | (g << 8) | b;
                        palette.push(hex);
                        colorIdx = palette.length - 1;
                        colorMap.set(rgbKey, colorIdx);
                    } else {
                        colorIdx = 0;
                    }
                }
                indexedPixels[j / 4] = colorIdx;
            }

            if (palette.length === 0) palette.push(0x000000);

            // Thêm frame vào file GIF
            gf.addFrame(0, 0, w, h, indexedPixels, {
                palette: palette,
                delay: delayCentiSec,
                transparent: 0,
                disposal: 2
            });
        }

        // Cắt vừa vặn dung lượng thật của GIF
        const gifBytes = buffer.subarray(0, gf.end());
        const blob = new Blob([gifBytes], { type: 'image/gif' });
        const gifUrl = URL.createObjectURL(blob);

        status.innerText = "Tạo thành công!";
        result.innerHTML = `
            <p><b>Kết quả GIF hoàn chỉnh:</b></p>
            <img src="${gifUrl}"><br>
            <a class="btn-download" href="${gifUrl}" download="zalo_sticker.gif">Tải File GIF Động</a>
        `;

    } catch (err) {
        console.error(err);
        status.innerText = "Lỗi xử lý: Kiểm tra lại đường dẫn Sprite hoặc CORS!";
    }
}
</script>

</body>
</html>
