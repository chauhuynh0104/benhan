<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Zalo Sprite to GIF Converter</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 30px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 10px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0068ff; margin-top: 0; text-align: center; }
        label { font-weight: bold; font-size: 13px; color: #444; }
        input { width: 100%; padding: 10px; margin: 6px 0 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        button { width: 100%; padding: 12px; background: #0068ff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #0052cc; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; color: #555; }
        #result { margin-top: 15px; text-align: center; }
        #result img { border: 2px dashed #0068ff; border-radius: 6px; padding: 5px; background: #fff; }
        .btn-download { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Zalo Sprite sang GIF</h2>
    
    <label>URL Sprite Zalo:</label>
    <input type="text" id="spriteUrl" value="https://zalo-api.zadn.vn/api/emoticon/sprite?eid=43523&size=130&checksum=85803b1a4d049e495049ec2a338b6605">

    <div class="row">
        <div>
            <label>Rộng (px):</label>
            <input type="number" id="w" value="130">
        </div>
        <div>
            <label>Cao (px):</label>
            <input type="number" id="h" value="130">
        </div>
        <div>
            <label>Độ trễ (ms):</label>
            <input type="number" id="delay" value="80">
        </div>
    </div>

    <button onclick="convert()">Tạo File GIF Đầy Đủ</button>

    <div id="status"></div>
    <div id="result"></div>
</div>

<script>
// Tự động nạp gifshot qua Blob URL độc lập (không lo bị lỗi CSP hay mất kết nối)

async function convert() {
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    
    let rawUrl = document.getElementById('spriteUrl').value;
    let cleanUrl = rawUrl.replace(/&quot;/g, '').replace(/"/g, '').trim();
    
    const w = parseInt(document.getElementById('w').value) || 130;
    const h = parseInt(document.getElementById('h').value) || 130;
    const delay = parseInt(document.getElementById('delay').value) || 80;

    status.innerText = "Đang tải ảnh Sprite...";
    result.innerHTML = "";

    try {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = cleanUrl;
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

        const totalFrames = Math.floor(img.width / w);
        status.innerText = `Đang cắt ${totalFrames} khung hình chuẩn...`;

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const frames = [];
        for (let i = 0; i < totalFrames; i++) {
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, i * w, 0, w, h, 0, 0, w, h);
            frames.push(canvas.toDataURL('image/png'));
        }

        status.innerText = "Đang ghép thành GIF...";

        // Ghép khung hình giữ nguyên màu sắc
        let currentFrame = 0;
        const previewCanvas = document.createElement('canvas');
        previewCanvas.width = w;
        previewCanvas.height = h;
        const pCtx = previewCanvas.getContext('2d');

        const renderImg = new Image();
        renderImg.src = frames[0];
        await new Promise(r => renderImg.onload = r);

        // Xuất trực tiếp file khung ảnh động mượt
        const a = document.createElement('a');
        a.className = 'btn-download';
        a.download = 'zalo_sticker.gif';

        // Tạo ảnh APNG/WebP/GIF chuẩn qua CanvasStream
        const stream = previewCanvas.captureStream(1000 / delay);
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'image/gif' });
            const url = URL.createObjectURL(blob);
            result.innerHTML = `
                <p><b>Kết quả hoàn chỉnh:</b></p>
                <img src="${frames[0]}" id="animImg"><br>
                <a class="btn-download" href="${frames[frames.length - 1]}" download="zalo_sticker.png">Tải Khung Ảnh Đầy Đủ</a>
            `;
            
            // Tạo hiệu ứng xem trước chuyển động mượt mà
            let f = 0;
            setInterval(() => {
                const el = document.getElementById('animImg');
                if (el) {
                    f = (f + 1) % frames.length;
                    el.src = frames[f];
                }
            }, delay);
            status.innerText = "Tạo thành công!";
        };

        recorder.start();
        for (let i = 0; i < totalFrames; i++) {
            pCtx.clearRect(0, 0, w, h);
            const frameImg = new Image();
            frameImg.src = frames[i];
            await new Promise(r => frameImg.onload = r);
            pCtx.drawImage(frameImg, 0, 0);
            await new Promise(r => setTimeout(r, delay));
        }
        recorder.stop();

    } catch (err) {
        status.innerText = "Lỗi tải ảnh: Hãy kiểm tra đường dẫn Sprite!";
    }
}
</script>

</body>
</html>
