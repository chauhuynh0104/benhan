<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đổi màu ảnh - Warm Tone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #f3eee5;
    font-family: Arial, sans-serif;
    color: #333;
}

.container {
    max-width: 900px;
    margin: auto;
    text-align: center;
}

h2 {
    margin-bottom: 18px;
}

.upload {
    display: inline-block;
    padding: 12px 22px;
    background: #8b6b43;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.upload:hover {
    background: #6f522f;
}

input {
    display: none;
}

.preview {
    margin-top: 20px;
    background: white;
    padding: 12px;
    border-radius: 14px;
    box-shadow: 0 5px 25px #0002;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
}

.buttons {
    margin-top: 15px;
}

button {
    border: 0;
    padding: 11px 18px;
    margin: 5px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

#download {
    background: #6f5130;
    color: white;
}

#reset {
    background: #ddd;
}
</style>
</head>

<body>

<div class="container">

<h2>🌤️ Chuyển ảnh sang tông vàng ấm</h2>

<label class="upload">
    📷 Chọn ảnh
    <input type="file" id="file" accept="image/*">
</label>

<div class="preview">
    <canvas id="canvas"></canvas>
</div>

<div class="buttons">
    <button id="download">⬇️ Tải ảnh</button>
    <button id="reset">↩️ Ảnh gốc</button>
</div>

</div>

<script>
const fileInput = document.getElementById("file");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let originalImage = null;

fileInput.addEventListener("change", function(e) {

    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();

    img.onload = function() {

        originalImage = img;

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        applyWarmTone();
    };

    img.src = URL.createObjectURL(file);
});


function applyWarmTone() {

    if (!originalImage) return;

    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    let imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let data = imageData.data;

    for (let i = 0; i < data.length; i += 4) {

        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        /*
         * Cân bằng trắng:
         * - tăng đỏ
         * - giữ xanh lá vừa phải
         * - giảm xanh dương
         */

        r = r * 1.10 + g * 0.18;
        g = g * 0.98;
        b = b * 0.68 + g * 0.05;

        /*
         * Tạo ánh vàng ấm
         */

        r += 8;
        g += 3;

        /*
         * Tăng sáng nhẹ
         */

        r *= 1.04;
        g *= 1.035;
        b *= 1.02;

        /*
         * Contrast nhẹ
         */

        r = (r - 128) * 1.03 + 128;
        g = (g - 128) * 1.03 + 128;
        b = (b - 128) * 1.03 + 128;

        data[i]     = clamp(r);
        data[i + 1] = clamp(g);
        data[i + 2] = clamp(b);
    }

    ctx.putImageData(imageData, 0, 0);
}


function clamp(value) {
    return Math.max(0, Math.min(255, value));
}


// Ảnh gốc
document.getElementById("reset").onclick = function() {

    if (!originalImage) return;

    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );
};


// Tải ảnh
document.getElementById("download").onclick = function() {

    if (!originalImage) {
        alert("Hãy chọn ảnh trước!");
        return;
    }

    const link = document.createElement("a");

    link.download = "anh_tong_vang_am.jpg";

    link.href = canvas.toDataURL(
        "image/jpeg",
        0.95
    );

    link.click();
};
</script>

</body>
</html>
