
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite → GIF</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 24px;
        font-family: Arial, sans-serif;
        background: #f5f5f5; color: #222;
    }
    .box {
        max-width: 850px; margin: auto; background: white;
        padding: 24px; border-radius: 16px;
        box-shadow: 0 4px 20px #0001;
    }
    h2 { margin-top: 0; }
    label { display:block; margin: 14px 0 6px; font-weight: 600; }
    input[type=text], input[type=number] {
        width: 100%; padding: 10px 12px;
        border: 1px solid #ccc; border-radius: 8px;
    }
    input[type=file] { width:100%; padding:8px 0; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .row > div { flex:1; min-width:140px; }
    button {
        border:0; border-radius:9px; padding:11px 18px;
        cursor:pointer; font-weight:600; margin-top:18px;
    }
    #convert { background:#1976d2; color:white; }
    #convert:disabled { opacity:.5; cursor:not-allowed; }
    #download {
        background:#2e7d32; color:white; display:none;
        text-decoration:none; padding:11px 18px; border-radius:9px;
        margin-left:8px;
    }
    #preview {
        margin-top:20px; min-height:150px;
        display:flex; align-items:center; justify-content:center;
        background:#eee; border-radius:10px; padding:12px;
    }
    #preview img { max-width:100%; image-rendering:auto; }
    #status { margin-top:14px; white-space:pre-wrap; color:#555; }
    .hint { color:#666; font-size:13px; line-height:1.5; }
    .check { display:flex; gap:8px; align-items:center; margin-top:12px; }
    code { background:#eee; padding:2px 5px; border-radius:4px; }
</style>
</head>
<body>
<div class="box">
    <h2>🖼️ Sprite → GIF</h2>
    <p class="hint">
        Dán link sprite hoặc tải ảnh sprite lên. Công cụ sẽ tự cắt thành từng ô
        <code>130 × 130</code> và ghép thành GIF.
    </p>

    <label>1. Link ảnh sprite</label>
    <input id="url" type="text"
        value="https://zalo-api.zadn.vn/api/emoticon/sprite?eid=43526&size=130&checksum=35d62da05d8afa250a6f3c8bb33ad513"
        placeholder="https://...">

    <label>Hoặc 2. Tải ảnh sprite</label>
    <input id="file" type="file" accept="image/*">

    <div class="row">
        <div>
            <label>Chiều rộng mỗi frame</label>
            <input id="fw" type="number" value="130" min="1">
        </div>
        <div>
            <label>Chiều cao mỗi frame</label>
            <input id="fh" type="number" value="130" min="1">
        </div>
        <div>
            <label>Thời gian/frame (ms)</label>
            <input id="delay" type="number" value="180" min="20">
        </div>
    </div>

    <label class="check">
        <input id="transparent" type="checkbox" checked>
        Giữ nền trong suốt
    </label>

    <button id="convert">Chuyển thành GIF</button>
    <a id="download" download="sprite.gif">⬇ Tải GIF</a>

    <div id="preview">
        <span>Preview sẽ hiện ở đây</span>
    </div>
    <div id="status"></div>
</div>

<!-- gif.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<script>
const $ = id => document.getElementById(id);

let previewURL = null;

function setStatus(text) {
    $("status").textContent = text;
}

function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Không đọc được ảnh."));
        };
        img.src = url;
    });
}

function loadImageFromURL(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        // Zalo phải cho phép CORS thì trình duyệt mới cho phép
        // vẽ ảnh URL trực tiếp vào canvas để tạo GIF.
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(
            "Không tải được ảnh từ URL. Nếu link không hỗ trợ CORS, hãy tải ảnh về rồi chọn 'Tải ảnh sprite'."
        ));
        img.src = url;
    });
}

$("convert").addEventListener("click", async () => {
    const button = $("convert");
    const file = $("file").files[0];
    const url = $("url").value.trim();
    const fw = Math.max(1, parseInt($("fw").value) || 130);
    const fh = Math.max(1, parseInt($("fh").value) || 130);
    const delay = Math.max(20, parseInt($("delay").value) || 180);

    if (!file && !url) {
        setStatus("❌ Hãy dán link hoặc chọn ảnh.");
        return;
    }

    button.disabled = true;
    $("download").style.display = "none";
    setStatus("⏳ Đang tải ảnh...");

    try {
        const img = file ? await loadImageFromFile(file) : await loadImageFromURL(url);

        const frames = Math.floor(img.width / fw);
        if (frames < 1) throw new Error("Ảnh quá nhỏ so với kích thước frame.");

        // Preview sprite gốc
        if (previewURL) URL.revokeObjectURL(previewURL);
        if (file) {
            previewURL = URL.createObjectURL(file);
            $("preview").innerHTML = `<img src="${previewURL}" alt="Sprite">`;
        } else {
            $("preview").innerHTML = "";
            const p = document.createElement("img");
            p.src = url;
            $("preview").appendChild(p);
        }

        setStatus(`✅ Ảnh: ${img.width} × ${img.height}px\n` +
                  `🎞️ Số frame: ${frames}\n` +
                  `⏱️ ${delay} ms/frame\n\nĐang tạo GIF...`);

        const gif = new GIF({
            workers: 2,
            quality: 10,
            width: fw,
            height: fh,
            transparent: $("transparent").checked ? 0x000000 : null,
            workerScript: "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js"
        });

        // Tạo canvas riêng để tránh làm bẩn canvas preview.
        const canvas = document.createElement("canvas");
        canvas.width = fw;
        canvas.height = fh;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        for (let i = 0; i < frames; i++) {
            ctx.clearRect(0, 0, fw, fh);
            if (!$("transparent").checked) {
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, fw, fh);
            }

            ctx.drawImage(
                img,
                i * fw, 0, fw, fh,
                0, 0, fw, fh
            );

            gif.addFrame(canvas, {copy: true, delay: delay});
            setStatus(`🎞️ Đang thêm frame ${i + 1}/${frames}...`);
        }

        gif.on("progress", p => {
            setStatus(`⚙️ Đang mã hóa GIF: ${Math.round(p * 100)}%`);
        });

        gif.on("finished", blob => {
            const gifURL = URL.createObjectURL(blob);
            const download = $("download");

            download.href = gifURL;
            download.style.display = "inline-block";

            $("preview").innerHTML = `<img src="${gifURL}" alt="GIF preview">`;
            setStatus(
                `✅ Hoàn tất!\n` +
                `🎞️ ${frames} frame\n` +
                `📐 ${fw} × ${fh}px\n` +
                `⏱️ ${delay} ms/frame\n` +
                `📦 ${(blob.size / 1024).toFixed(1)} KB`
            );
            button.disabled = false;
        });

        gif.render();

    } catch (err) {
        console.error(err);
        setStatus("❌ " + err.message);
        button.disabled = false;
    }
});
</script>
</body>
</html>
