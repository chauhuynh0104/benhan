<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Diễn Biến Kỹ Thuật PHCN - Dr. Châu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; text-align: center; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        .upload-section { border: 2px dashed #1a73e8; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .upload-section:hover { background: #e8f0fe; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; vertical-align: top; }
        th { background: #1a73e8; color: white; }
        .old-content { color: #888; font-size: 0.85em; background: #f9f9f9; padding: 8px; border-radius: 4px; margin-bottom: 8px; display: block; border-left: 3px solid #ccc; font-style: italic; }
        .new-content { color: #202124; font-weight: 500; font-size: 1.05em; line-height: 1.5; display: block; padding: 5px; }
        .weekend { background-color: #fff4e5; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        button, select { padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-weight: bold; transition: 0.2s; font-size: 14px; height: 42px; }
        #processBtn { background: #1a73e8; color: white; border: none; flex: 1; cursor: pointer; }
        #toggleOldBtn { background: #5f6368; color: white; border: none; cursor: pointer; }
        #diseaseSelect { background: #ffffff; color: #1a73e8; border: 2px solid #1a73e8; font-weight: bold; cursor: pointer; outline: none; }
        button:hover, select:hover { opacity: 0.9; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .hidden { display: none !important; }
        .copy-btn {
            padding: 4px 8px;
            background: #34a853;
            color: white;
            font-size: 12px;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .copy-btn:hover { background: #2d8e47; }
        .new-content span { cursor: pointer; transition: background 0.2s; }
        .new-content span:hover { background-color: #f0f0f0; border-radius: 4px; }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #1a73e8;
            cursor: pointer;
            padding: 0 10px;
            border: 1px solid #1a73e8;
            border-radius: 5px;
            background: #f8f9fa;
            height: 40px;
        }
        .checkbox-container input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Xử Lý Diễn Biến Kỹ Thuật PHCN</h2>
    
    <div id="uploadWrapper" class="upload-section" onclick="document.getElementById('fileInput').click()">
        <strong>Click để chọn file HTML</strong>
        <input type="file" id="fileInput" accept=".html" style="display:none">
        <p id="fileNameDisplay" style="margin-top:10px; color: #555;"></p>
    </div>

    <div class="btn-group">
        <button id="processBtn" disabled>XỬ LÝ DỮ LIỆU</button>
        <select id="diseaseSelect" class="hidden">
            <!-- Tùy chọn lọc bệnh sẽ được tự động thêm vào đây -->
        </select>
        <button id="toggleOldBtn" class="hidden">ẨN/HIỆN NỘI DUNG CŨ</button>
        <label class="checkbox-container hidden" id="rawModeWrapper">
            <input type="checkbox" id="rawModeCheckbox"> Hiển thị nguyên văn
        </label>
    </div>

    <div id="resultArea"></div>
</div>

<script>
    window.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
            e.preventDefault();
            window.location.reload();
        }
    });

    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const toggleBtn = document.getElementById('toggleOldBtn');
    const rawModeCheckbox = document.getElementById('rawModeCheckbox');
    const rawModeWrapper = document.getElementById('rawModeWrapper');
    const diseaseSelect = document.getElementById('diseaseSelect');
    const resultArea = document.getElementById('resultArea');
    const uploadWrapper = document.getElementById('uploadWrapper');
    
    let originalHtml = "";

    // Định nghĩa danh mục bệnh và từ khóa nhận diện tương ứng
    const DISEASE_RULES = [
        { id: "co", name: "Cổ", regex: /cổ/i },
        { id: "vai", name: "Vai", regex: /vai/i },
        { id: "thatlung", name: "Thắt lưng", regex: /thắt lưng/i },
        { id: "lietmat", name: "Liệt mặt", regex: /không kín|mờ|miệng méo|cải thiện|mắt|nếp nhăn trán|nhân trung|rãnh mũi má|liệt mặt/i }
    ];

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileNameDisplay').innerText = "Đã chọn: " + file.name;
        const reader = new FileReader();
        reader.onload = (e) => { 
            originalHtml = e.target.result; 
            
            uploadWrapper.style.display = 'none';
            toggleBtn.classList.remove('hidden');
            rawModeWrapper.classList.remove('hidden');

            // Phát hiện các bệnh xuất hiện trong File
            detectAndSetupDiseases();
            runProcessing();
        };
        reader.readAsText(file);
    });

    rawModeCheckbox.addEventListener('change', runProcessing);
    diseaseSelect.addEventListener('change', runProcessing);

    // Kiểm tra file có những bệnh nào để hiển thị Dropdown
    function detectAndSetupDiseases() {
        let foundDiseases = new Set();

        DISEASE_RULES.forEach(rule => {
            if (rule.regex.test(originalHtml)) {
                foundDiseases.add(rule);
            }
        });

        // Nếu phát hiện từ 2 bệnh trở lên -> Hiển thị Dropdown
        if (foundDiseases.size >= 2) {
            diseaseSelect.innerHTML = `<option value="ALL">-- Tất cả bệnh (${foundDiseases.size}) --</option>`;
            foundDiseases.forEach(d => {
                diseaseSelect.innerHTML += `<option value="${d.id}">Bệnh: ${d.name}</option>`;
            });
            diseaseSelect.classList.remove('hidden');
        } else {
            diseaseSelect.classList.add('hidden');
            diseaseSelect.innerHTML = "";
        }
    }

    function runProcessing() {
        if (!originalHtml) return;
        const selectedDisease = diseaseSelect.value || "ALL";
        const daysData = parseAndProcess(originalHtml, rawModeCheckbox.checked, selectedDisease);
        renderTable(daysData);
    }

    function isWeekend(dateStr) {
        const [d, m, y] = dateStr.split('/');
        const date = new Date(y, m - 1, d);
        return date.getDay() === 0 || date.getDay() === 6; 
    }

    function decodeHTMLEntities(text) {
        const textArea = document.createElement('textarea');
        textArea.innerHTML = text;
        return textArea.value;
    }

    function cleanAndFormatText(textArr) {
        let joinedText = textArr.join(". ");
        
        joinedText = joinedText.replace(/Khám\s*:\s*/gi, "");
        joinedText = joinedText.replace(/mạch trầm\.?/gi, "");
        joinedText = joinedText.replace(/Bụng không đau, không ợ chua ợ hơi, không nôn, không buồn nôn.\.?/gi, ""); 
        joinedText = joinedText.replace(/Bệnh tỉnh,\s*tiếp xúc tốt/g, "Tỉnh, tiếp xúc tốt");
        
        joinedText = joinedText
            .replace(/\.\s*\./g, '.')
            .replace(/,\s*\./g, '.')
            .replace(/\s\s+/g, ' ')
            .trim();
            
        if (joinedText) {
            joinedText = joinedText.charAt(0).toUpperCase() + joinedText.slice(1);
            if (!joinedText.endsWith('.')) {
                joinedText += '.';
            }
        }
        return joinedText;
    }

    function parseAndProcess(html, isRawMode, filterDisease) {
        const dayRegex = /<td\b[^>]*>\s*<nobr>(\d{2}\/\d{2}\/\d{4})<\/nobr>[\s\S]*?<\/td>/gi;
        const matches = [...html.matchAll(dayRegex)];
        let results = [];
        let previousCorePain = ""; 

        matches.forEach((match, i) => {
            const dateStr = match[1];
            const start = match.index;
            const end = (matches[i+1]) ? matches[i+1].index : html.length;
            const block = html.substring(start, end);
            const contentAreaRegex = /<div style="overflow:hidden;width:295px;[\s\S]*?">([\s\S]*?)<\/div>/i;
            const contentMatch = block.match(contentAreaRegex);
            
            let oldText = "";
            let newText = "";

            if (contentMatch) {
                const spanRegex = /<span[^>]*>([\s\S]*?)<\/span>/gi;
                let rawLines = [];
                let m;
                while ((m = spanRegex.exec(contentMatch[1])) !== null) {
                    let decodedText = decodeHTMLEntities(m[1]);
                    let text = decodedText.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
                    if (text && !text.includes('{SignLibrary') && !/đau đầu âm ỉ/i.test(text)) {
                        rawLines.push(text);
                    }
                }
                oldText = rawLines.join(". ");

                if (isRawMode) {
                    newText = cleanAndFormatText(rawLines);
                } 
                else {
                    if (isWeekend(dateStr)) {
                        const [d, m, y] = dateStr.split('/');
                        const dateObj = new Date(y, m - 1, d);
                        newText = (dateObj.getDay() === 6) ? "Thứ bảy." : "Chủ nhật.";
                        previousCorePain = ""; 
                    } else {
                        let baseStatus = (i % 2 === 0) ? "Tỉnh, tiếp xúc tốt" : "Tỉnh, tiếp xúc tốt. Sinh hiệu ổn";
                        let matchedLines = [];

                        for (let line of rawLines) {
                            const isTargetSymptom = (line.startsWith("Đau") || line.startsWith("Còn đau") || line.startsWith("Mắt") || line.startsWith("nếp nhăn trán")|| line.startsWith("Nhân trung")|| line.startsWith("Rãnh mũi má")|| line.startsWith("Liệt mặt")) && /cổ|vai|thắt lưng|không kín|mờ|miệng méo|cải thiện/i.test(line);
                            const hasNoGoi = !/gối/i.test(line);

                            if (isTargetSymptom && hasNoGoi) {
                                // Lọc theo bệnh được chọn trên Dropdown
                                if (filterDisease !== "ALL") {
                                    const rule = DISEASE_RULES.find(r => r.id === filterDisease);
                                    if (rule && rule.regex.test(line)) {
                                        matchedLines.push(line);
                                    }
                                } else {
                                    matchedLines.push(line);
                                }
                            }
                        }

                        if (matchedLines.length > 0) {
                            let processedLines = matchedLines.map(currentPainLine => {
                                let processedPain = currentPainLine;
                                if (currentPainLine === previousCorePain || (processedPain.match(/đau tăng/g) || []).length > 1) {
                                    const altVars = ["đau nhiều về đêm.", "vận động còn đau."];
                                    let selectedAlt = altVars[i % altVars.length];
                                    if (processedPain.includes("vận động hạn chế")) {
                                        processedPain = processedPain.replace("vận động hạn chế", selectedAlt);
                                    } else {
                                        processedPain = processedPain.replace(/,?\s*gặp lạnh đau tăng/g, ", " + selectedAlt);
                                        processedPain = processedPain.replace(/,?\s*vận động đau tăng/g, ", " + selectedAlt);
                                    }
                                }
                                return processedPain;
                            });

                            let combinedPain = processedLines.join(". ");
                            newText = baseStatus + ". " + combinedPain;
                            previousCorePain = matchedLines[0]; 
                        } else {
                            newText = baseStatus + ".";
                            previousCorePain = ""; 
                        }
                        
                        let formattedArr = newText.split(". ");
                        newText = cleanAndFormatText(formattedArr);
                    }
                }
            }
            results.push({ 
                date: dateStr, 
                old: oldText, 
                new: newText, 
                weekend: isWeekend(dateStr) 
            });
        });
        return results;
    }

    function renderTable(data) {
        let html = `<table><thead><tr><th style="width:120px">Ngày</th><th>Diễn biến (Cũ & Mới)</th></tr></thead><tbody>`;
        data.forEach((item, index) => {
            html += `<tr class="${item.weekend ? 'weekend' : ''}">
                <td><strong>${item.date}</strong>${item.weekend ? '<br><small style="color:orange">(Thứ 7/CN)</small>' : ''}</td>
                <td>
                    <div class="old-content"><strong>Gốc:</strong> ${item.old}</div>
                    <div class="new-content">
                        <span id="text-${index}" onclick="copyToClipboard('${index}')" title="Click để copy">${item.new}</span>
                        <button id="btn-${index}" class="copy-btn" onclick="copyToClipboard('${index}')" style="float:right;">Copy</button>
                    </div>
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
        resultArea.innerHTML = html;
    }

    function copyToClipboard(index) {
        const text = document.getElementById('text-' + index).innerText;
        const btn = document.getElementById('btn-' + index);
        
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Đã chép!";
            btn.style.background = "#5f6368";
            const textSpan = document.getElementById('text-' + index);
            textSpan.style.color = "#34a853";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "#34a853";
                textSpan.style.color = "";
            }, 1000);
        });
    }

    toggleBtn.addEventListener('click', () => {
        document.querySelectorAll('.old-content').forEach(el => el.classList.toggle('hidden'));
    });
</script>

</body>
</html>
